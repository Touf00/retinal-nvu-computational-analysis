name: IMACS archive computed results
on:
  push:
    branches: [imacs-stroke-pet-screen]
    paths:
      - ".github/workflows/imacs_archive_outputs.yml"
      - "IMACS_Stroke_PET/scripts/audit_all_results.py"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: imacs-stroke-pet-screen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imacs-stroke-pet-screen
          persist-credentials: true
      - name: Synchronize branch before generating results
        run: |
          git fetch origin imacs-stroke-pet-screen
          git rebase origin/imacs-stroke-pet-screen

      - name: Collect latest successful data artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          while IFS='|' read -r workflow artifact source_subdir dest; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$BRANCH" --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion=="success") | .databaseId' | head -n 1 || true)"
            if [[ -z "$run_id" ]]; then echo "Not yet successful: $workflow"; continue; fi
            target="tmp/$dest"
            mkdir -p "$target"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$artifact" -D "$target"; then
              echo "Cannot download artifact from run $run_id"; continue
            fi
            src="$target/$source_subdir"
            if [[ -d "$src" ]]; then
              mkdir -p "IMACS_Stroke_PET/results/$dest"
              find "$src" -maxdepth 1 -type f -exec cp {} "IMACS_Stroke_PET/results/$dest/" \;
              echo "$run_id" > "IMACS_Stroke_PET/results/$dest/source_run_id.txt"
            fi
          done <<'EOF'
          IMACS stroke PET screen|imacs-stroke-pet-primary-screen|imacs_stroke_pet_run/results|primary
          IMACS temporal stroke PET screen|imacs-stroke-pet-temporal-screen|imacs_stroke_pet_temporal/results|temporal
          IMACS rat stroke PET screen|imacs-rat-48h-screen|imacs_stroke_pet_rat/results|rat
          IMACS spatial stroke PET screen|imacs-spatial-screen|imacs_stroke_pet_spatial/results|spatial
          IMACS atlas source audit|imacs-atlas-provenance-audit|imacs_stroke_pet_atlas/results|atlas
          IMACS full SCP3078 atlas screen|imacs-full-atlas-processed|imacs_stroke_pet_atlas_full/results|atlas_full
          IMACS independent validation source audit|imacs-independent-source-audit|imacs_stroke_pet_validation/results|independent_sources
          IMACS independent vascular astro target validation|imacs-independent-biological-validation|imacs_stroke_pet_independent/results|independent
          IMACS independent day3 tMCAO spatial check|imacs-spatial-day3-2026-results|imacs_day3_2026/results|spatial_day3
          IMACS processed spatial region source probe|imacs-spatial-source-probe|.|source_probes
          IMACS human paired brain stroke screen|imacs-human-paired-ischemia-screen|imacs_human_paired/results|human
          IMACS independent day-2 brain EC validation|imacs-GSE225948-day2-EC-4v4|imacs_stroke_GSE225948/results|independent_day2
          IMACS replicated day2 versus day14 stroke EC comparison|imacs-GSE225948-day14-vs-day2-EC|imacs_stroke_GSE225948_late/results|independent_late
          IMACS independent day-2 mouse stroke source probe|imacs-GSE225948-source-probe|.|independent_day2_source
          EOF

      - name: Run scientific audit after collecting data
        run: |
          python -m pip install -q "pandas>=2.0"
          python IMACS_Stroke_PET/scripts/audit_all_results.py
          python IMACS_Stroke_PET/scripts/integrate_candidates.py

      - name: Commit only small reproducible result tables to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f IMACS_Stroke_PET/results/
          if git diff --cached --quiet; then
            echo "No new results to archive"
          else
            git commit -m "Archive IMACS processed tables and run provenance [skip ci]"
            # Concurrent notebook/documentation commits may advance the isolated branch.
            # Rebase on latest remote and retry; never force-push or touch main.
            for attempt in 1 2 3; do
              if git push origin HEAD:imacs-stroke-pet-screen; then
                echo "Archived results pushed successfully"
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "Could not push archived results after three non-destructive retries" >&2
                exit 1
              fi
              git fetch origin imacs-stroke-pet-screen
              git rebase origin/imacs-stroke-pet-screen
            done
          fi

# Rebuild latest integrated matrix after /TEAMRED removal of nonreplicated sign concordance.
# Archive human dataset after run 38326150950 and repaired DESeq2 run 38325572095.
