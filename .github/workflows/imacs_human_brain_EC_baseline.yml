name: IMACS six human brain EC surgical-control expression baseline
on:
  push:
    branches: [imacs-stroke-pet-screen]
    paths:
      - ".github/workflows/imacs_human_brain_EC_baseline.yml"
      - "IMACS_Stroke_PET/scripts/audit_GSE256490_human_EC_baseline.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  human_EC_baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imacs-stroke-pet-screen
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matrix analysis dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.0,<3" "scipy>=1.12,<2"
      - name: Analyze six human adult control brain FACS EC GEO source matrices independently
        run: python -u IMACS_Stroke_PET/scripts/audit_GSE256490_human_EC_baseline.py
      - name: Archive six-preparation human baseline without raw source data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMACS_Stroke_PET/results/human_vascular_reference/
          if ! git diff --cached --quiet; then
            git commit -m "Archive original human six-patient surgical-control FACS endothelial baseline [skip ci]"
            git fetch origin imacs-stroke-pet-screen
            git rebase origin/imacs-stroke-pet-screen
            git push origin HEAD:imacs-stroke-pet-screen
          fi
      - name: Keep compact reports even if archive push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imacs-six-human-brain-endothelial-control-baseline
          path: IMACS_Stroke_PET/results/human_vascular_reference/
          if-no-files-found: warn
          retention-days: 30
