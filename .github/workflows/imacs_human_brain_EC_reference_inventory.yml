name: IMACS human brain EC reference GEO inventory
on:
  push:
    branches: [imacs-stroke-pet-screen]
    paths:
      - ".github/workflows/imacs_human_brain_EC_reference_inventory.yml"
      - "IMACS_Stroke_PET/scripts/audit_GSE256490_human_vascular_inventory.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imacs-stroke-pet-screen
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original GEO human adult temporal-lobe EC sample inventory
        run: python IMACS_Stroke_PET/scripts/audit_GSE256490_human_vascular_inventory.py
      - name: Archive small source-certified sample manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMACS_Stroke_PET/results/human_vascular_reference/
          if ! git diff --cached --quiet; then
            git commit -m "Archive original GSE256490 healthy brain EC GEO library inventory [skip ci]"
            git fetch origin imacs-stroke-pet-screen
            git rebase origin/imacs-stroke-pet-screen
            git push origin HEAD:imacs-stroke-pet-screen
          fi
      - name: Preserve inventory on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imacs-human-vascular-GEO-original-inventory
          path: IMACS_Stroke_PET/results/human_vascular_reference/
          if-no-files-found: warn
          retention-days: 30
