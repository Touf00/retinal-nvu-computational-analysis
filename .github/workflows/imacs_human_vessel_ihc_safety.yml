name: IMACS human stroke vessel ICAM1 VCAM1 analysis safeguards
on:
  push:
    branches: [imacs-stroke-pet-screen]
    paths:
      - ".github/workflows/imacs_human_vessel_ihc_safety.yml"
      - "IMACS_Stroke_PET/scripts/analyze_human_ischemic_vessel_IHC.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  donor_level_safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imacs-stroke-pet-screen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify patient-level exact signs and FFPE accessibility limits
        run: python IMACS_Stroke_PET/scripts/analyze_human_ischemic_vessel_IHC.py --self-test
      - name: Confirm NO clinical histology data were generated from synthetic QC
        shell: bash
        run: |
          set -euo pipefail
          test ! -d IMACS_Stroke_PET/results/human_vessel_IHC_actual
          echo "Synthetic validation only; no human IHC data and no PET experiments claimed."
