name: IMACS independent day3 tMCAO spatial check

on:
  push:
    branches: [imacs-stroke-pet-screen]
    paths:
      - "IMACS_Stroke_PET/notebooks/09_spatial_GSE337578_day3_screen.ipynb"
      - ".github/workflows/imacs_spatial_day3_2026.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
    env:
      IMACS_ROOT: ${{ github.workspace }}/imacs_day3_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel
      - name: Process one-sample day3 tMCAO spatial dataset
        run: |
          mkdir -p executed
          jupyter nbconvert --to notebook --execute \
            IMACS_Stroke_PET/notebooks/09_spatial_GSE337578_day3_screen.ipynb \
            --output "${{ github.workspace }}/executed/09_spatial_GSE337578_day3_screen.executed.ipynb" \
            --ExecutePreprocessor.timeout=5000 \
            --ExecutePreprocessor.kernel_name=python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imacs-spatial-day3-2026-results
          path: |
            executed/
            imacs_day3_2026/results/
            imacs_day3_2026/figures/
          retention-days: 30
          if-no-files-found: warn
