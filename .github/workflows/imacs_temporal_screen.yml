name: IMACS temporal stroke PET screen

on:
  push:
    branches: [imacs-stroke-pet-screen]
    paths:
      - "IMACS_Stroke_PET/notebooks/02_temporal_GSE227651_screen.ipynb"
      - "IMACS_Stroke_PET/config/candidate_catalog.csv"
      - ".github/workflows/imacs_temporal_screen.yml"
  workflow_dispatch:

jobs:
  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      IMACS_ROOT: ${{ github.workspace }}/imacs_stroke_pet_temporal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel

      - name: Execute descriptive temporal GSE227651 screen
        run: |
          mkdir -p executed
          jupyter nbconvert \
            --to notebook --execute \
            IMACS_Stroke_PET/notebooks/02_temporal_GSE227651_screen.ipynb \
            --output "${{ github.workspace }}/executed/02_temporal_GSE227651_screen.executed.ipynb" \
            --ExecutePreprocessor.timeout=7000 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload temporal analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imacs-stroke-pet-temporal-screen
          path: |
            executed/
            imacs_stroke_pet_temporal/results/
            imacs_stroke_pet_temporal/figures/
          if-no-files-found: warn
          retention-days: 30
